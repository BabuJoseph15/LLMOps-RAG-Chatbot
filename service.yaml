apiVersion: v1
kind: Service
metadata:
  name: rag-chatbot-service

spec:

  selector:
    app: rag-chatbot

  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30090

  type: NodePort

---
apiVersion: v1
kind: Service
metadata:
  name: rag-chatbot-frontend-service

spec:

  selector:
    app: rag-chatbot-frontend

  ports:
  - protocol: TCP
    port: 8501
    targetPort: 8501
    nodePort: 30091

  type: NodePort
