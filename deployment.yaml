apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-chatbot
  labels:
    app: rag-chatbot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rag-chatbot

  template:
    metadata:
      labels:
        app: rag-chatbot

    spec:
      containers:
        - name: rag-chatbot

          image: babujoseph5757/rag-chatbot:v2
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.minikube.internal:11434"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
