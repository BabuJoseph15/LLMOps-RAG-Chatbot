apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-chatbot
  template:
    metadata:
      labels:
        app: rag-chatbot
    spec:
      containers:
      - name: rag-chatbot
        image: <dockerhub-username>/rag-chatbot:v1

        ports:
        - containerPort: 8000

        env:
        - name: OLLAMA_BASE_URL
          value: "http://<OLLAMA_IP>:11434"
