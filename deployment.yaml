apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rag-chatbot

  template:
    metadata:
      labels:
        app: rag-chatbot

    spec:
      containers:

      - name: rag-chatbot

        image: babujoseph5757/rag-chatbot:30

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        env:
        - name: OLLAMA_BASE_URL
          value: "http://host.minikube.internal:11434"

        resources:

          requests:
            cpu: "500m"
            memory: "2Gi"

          limits:
            cpu: "2000m"
            memory: "4Gi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 6

        livenessProbe:
          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rag-chatbot-frontend

  template:
    metadata:
      labels:
        app: rag-chatbot-frontend

    spec:
      containers:

      - name: rag-chatbot-frontend

        image: babujoseph5757/rag-chatbot-frontend:30

        imagePullPolicy: Always

        ports:
        - containerPort: 8501

        env:
        - name: BACKEND_URL
          value: "http://rag-chatbot-service:8000"

        resources:

          requests:
            cpu: "100m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 20
          periodSeconds: 10
