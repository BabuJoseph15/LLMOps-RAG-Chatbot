apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rag-chatbot

  template:
    metadata:
      labels:
        app: rag-chatbot

    spec:
      containers:
      - name: rag-chatbot

        image: babujoseph5757/rag-chatbot:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rag-chatbot-frontend

  template:
    metadata:
      labels:
        app: rag-chatbot-frontend

    spec:
      containers:
      - name: rag-chatbot-frontend

        image: babujoseph5757/rag-chatbot-frontend:latest

        imagePullPolicy: Always

        env:
        - name: BACKEND_URL
          value: "http://rag-chatbot-service:8000"

        ports:
        - containerPort: 8501
